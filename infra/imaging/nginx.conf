server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # The basePath root needs a concrete route to avoid a slash redirect loop.
    location = /otcms {
        return 302 /otcms/home;
    }

    location = /otcms/ {
        return 302 /otcms/home;
    }

    location /otcms/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Local smoke limit is aligned with the documented 80,000,000-byte Spring setting.
        client_max_body_size 82m;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    location /dicom-web/ {
        # Browser DICOMweb reads must pass the Spring study-scoped grant gateway.
        # Spring Boot runs on the host for this local lab and calls private Orthanc itself.
        proxy_pass http://host.docker.internal:8080/dicom-web/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 1m;
    }

    # A bare /viewer has no study scope or grant. Return to the technician
    # workspace, where the user can choose a study and receive its scoped grant.
    location = /viewer {
        if ($args = "") {
            return 302 /otcms/imaging;
        }
        proxy_pass http://ohif:80;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ohif:80;
        proxy_set_header Host $host;
    }
}
