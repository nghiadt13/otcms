# Local imaging laboratory only. Never load identifiable patient studies here.
services:
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    ports:
      - "127.0.0.1:3310:3310"
    restart: unless-stopped

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set from backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set from backend/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  orthanc:
    image: orthancteam/orthanc:26.7.0
    environment:
      ORTHANC__NAME: OTCMS Local Archive
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      DICOM_WEB_PLUGIN_ENABLED: "true"
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    volumes:
      - orthanc-data:/var/lib/orthanc/db

  ohif:
    image: ohif/app:v3.12.18
    volumes:
      - ./infra/imaging/ohif-app-config.js:/usr/share/nginx/html/app-config.js:ro

  imaging-gateway:
    image: nginx:1.28.0-alpine
    depends_on:
      - ohif
    extra_hosts:
      # On this Windows Docker Desktop setup, host-gateway resolves only to
      # an unreachable IPv6 address. Override via OTCMS_DOCKER_HOST_GATEWAY
      # if Docker Desktop assigns a different reachable host IPv4 address.
      - "host.docker.internal:${OTCMS_DOCKER_HOST_GATEWAY:-192.168.65.254}"
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./infra/imaging/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  minio-data:
    name: otcms_minio-data
  orthanc-data:
