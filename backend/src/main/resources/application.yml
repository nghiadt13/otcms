
# Local development uses the PostgreSQL database started by docker-compose.final-db.yml.

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: OTCMS_BE
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: jdbc:postgresql://127.0.0.1:${OTCMS_DB_PORT:5433}/${OTCMS_DB_NAME:otcms_dev}
    username: ${OTCMS_DB_USERNAME:postgres}
    password: ${OTCMS_DB_PASSWORD:otcms_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: ${OTCMS_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${OTCMS_DB_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    # Teammates may merge migrations in a different order. Let Flyway apply late-arriving migrations.
    out-of-order: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

otcms:
  imaging:
    enabled: ${OTCMS_IMAGING_ENABLED:false}
    max-upload-bytes: ${OTCMS_IMAGING_MAX_UPLOAD_BYTES:0}
    max-upload-files: ${OTCMS_IMAGING_MAX_UPLOAD_FILES:0}
    max-concurrent-uploads: ${OTCMS_IMAGING_MAX_CONCURRENT_UPLOADS:0}
    orthanc-base-uri: ${OTCMS_IMAGING_ORTHANC_BASE_URI:}
    orthanc-connect-timeout: ${OTCMS_IMAGING_ORTHANC_CONNECT_TIMEOUT:0s}
    orthanc-response-timeout: ${OTCMS_IMAGING_ORTHANC_RESPONSE_TIMEOUT:0s}

app:
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    bucket: ${APP_STORAGE_BUCKET:otcms-media}
    local-root: ${APP_STORAGE_LOCAL_ROOT:./.storage}
    supabase-s3:
      endpoint: ${APP_STORAGE_SUPABASE_S3_ENDPOINT:}
      region: ${APP_STORAGE_SUPABASE_S3_REGION:}
      access-key: ${APP_STORAGE_SUPABASE_S3_ACCESS_KEY:}
      secret-key: ${APP_STORAGE_SUPABASE_S3_SECRET_KEY:}
  diagnostic:
    report-storage:
      provider: ${APP_DIAGNOSTIC_REPORT_STORAGE_PROVIDER:local}
      minio:
        endpoint: ${APP_DIAGNOSTIC_REPORT_STORAGE_MINIO_ENDPOINT:http://127.0.0.1:9000}
        region: ${APP_DIAGNOSTIC_REPORT_STORAGE_MINIO_REGION:us-east-1}
        bucket: ${APP_DIAGNOSTIC_REPORT_STORAGE_MINIO_BUCKET:otcms-diagnostic-reports}
        access-key: ${MINIO_ROOT_USER:}
        secret-key: ${MINIO_ROOT_PASSWORD:}
    report-validation:
      provider: ${APP_DIAGNOSTIC_REPORT_VALIDATION_PROVIDER:clamav-local}
      clamav:
        host: ${APP_DIAGNOSTIC_CLAMAV_HOST:127.0.0.1}
        port: ${APP_DIAGNOSTIC_CLAMAV_PORT:3310}
        connect-timeout-ms: ${APP_DIAGNOSTIC_CLAMAV_CONNECT_TIMEOUT_MS:1000}
        read-timeout-ms: ${APP_DIAGNOSTIC_CLAMAV_READ_TIMEOUT_MS:15000}
  arrival-qr:
    clinic-id: ${APP_ARRIVAL_QR_CLINIC_ID:single-clinic}
    hmac-secret: ${APP_ARRIVAL_QR_HMAC_SECRET:}
    ttl-seconds: ${APP_ARRIVAL_QR_TTL_SECONDS:60}
    refresh-seconds: ${APP_ARRIVAL_QR_REFRESH_SECONDS:30}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    host: ${APP_EMAIL_HOST:smtp.gmail.com}
    port: ${APP_EMAIL_PORT:587}
    username: ${APP_EMAIL_USERNAME:}
    password: ${APP_EMAIL_PASSWORD:}
    from: ${APP_EMAIL_FROM:}
    connect-timeout-ms: ${APP_EMAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_EMAIL_READ_TIMEOUT_MS:10000}
    write-timeout-ms: ${APP_EMAIL_WRITE_TIMEOUT_MS:10000}
    max-attempts: ${APP_EMAIL_MAX_ATTEMPTS:2}
  payment:
    payos:
      enabled: ${APP_PAYMENT_PAYOS_ENABLED:false}
      client-id: ${APP_PAYMENT_PAYOS_CLIENT_ID:}
      api-key: ${APP_PAYMENT_PAYOS_API_KEY:}
      checksum-key: ${APP_PAYMENT_PAYOS_CHECKSUM_KEY:}
      return-url: ${APP_PAYMENT_PAYOS_RETURN_URL:http://localhost:3000/portal/payments/result}
      cancel-url: ${APP_PAYMENT_PAYOS_CANCEL_URL:http://localhost:3000/portal/payments/result}
      link-ttl-seconds: ${APP_PAYMENT_PAYOS_LINK_TTL_SECONDS:900}
      timeout-ms: ${APP_PAYMENT_PAYOS_TIMEOUT_MS:5000}
  auth:
    password-reset-url: ${APP_AUTH_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    rate-limit-hmac-secret: ${APP_AUTH_RATE_LIMIT_HMAC_SECRET:}
    staff-network:
      allowed-cidrs: ${APP_AUTH_STAFF_ALLOWED_CIDRS:127.0.0.1/32,::1/128}
      trusted-proxy-cidrs: ${APP_AUTH_STAFF_TRUSTED_PROXY_CIDRS:}
    session-security:
      jwt-secret: ${APP_AUTH_JWT_SECRET:}
      access-token-seconds: ${APP_AUTH_ACCESS_TOKEN_SECONDS:900}
      refresh-token-seconds: ${APP_AUTH_REFRESH_TOKEN_SECONDS:604800}
      cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Strict}
      cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
      patient-origins: ${APP_AUTH_PATIENT_ORIGINS:https://patient.otcms.local}
      staff-origins: ${APP_AUTH_STAFF_ORIGINS:https://staff.otcms.local}

appointment:
  booking:
    max-horizon-days: ${APPOINTMENT_BOOKING_MAX_HORIZON_DAYS:30}
    patient-change-deadline-minutes: ${APPOINTMENT_BOOKING_PATIENT_CHANGE_DEADLINE_MINUTES:120}
    check-in-early-minutes: ${APPOINTMENT_BOOKING_CHECK_IN_EARLY_MINUTES:30}
    check-in-late-grace-minutes: ${APPOINTMENT_BOOKING_CHECK_IN_LATE_GRACE_MINUTES:15}
    slot-interval-minutes: ${APPOINTMENT_BOOKING_SLOT_INTERVAL_MINUTES:15}
    clinic-time-zone: ${APPOINTMENT_BOOKING_CLINIC_TIME_ZONE:Asia/Ho_Chi_Minh}
    payment-hold-minutes: ${APPOINTMENT_BOOKING_PAYMENT_HOLD_MINUTES:15}
    payment-hold-sweep-ms: ${APPOINTMENT_BOOKING_PAYMENT_HOLD_SWEEP_MS:30000}
    payment-hold-sweep-enabled: ${APPOINTMENT_BOOKING_PAYMENT_HOLD_SWEEP_ENABLED:true}
    no-show-sweep-ms: ${APPOINTMENT_BOOKING_NO_SHOW_SWEEP_MS:600000}
    no-show-sweep-enabled: ${APPOINTMENT_BOOKING_NO_SHOW_SWEEP_ENABLED:true}
    public-rate-limit:
      requests: ${APPOINTMENT_BOOKING_PUBLIC_RATE_LIMIT_REQUESTS:60}
      window-seconds: ${APPOINTMENT_BOOKING_PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
      trusted-proxy-cidrs: ${APPOINTMENT_BOOKING_PUBLIC_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    readiness:
      required: ${APPOINTMENT_BOOKING_READINESS_REQUIRED:true}
      evidence-file: ${APPOINTMENT_BOOKING_READINESS_EVIDENCE_FILE:}
      evidence-sha256: ${APPOINTMENT_BOOKING_READINESS_EVIDENCE_SHA256:}
      evidence-signature: ${APPOINTMENT_BOOKING_READINESS_EVIDENCE_SIGNATURE:}
      verification-public-key: ${APPOINTMENT_BOOKING_READINESS_PUBLIC_KEY:}
      release-id: ${APP_RELEASE_ID:}
      migration-version: ${APP_EXPECTED_MIGRATION_VERSION:}
      expected-owner: ${APPOINTMENT_BOOKING_READINESS_OWNER:Owner Long}
