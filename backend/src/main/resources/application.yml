
# Supabase provides managed PostgreSQL. Credentials must come from the process
# environment and must not be committed to this repository.

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: OTCMS_BE

  datasource:
    # Include ?sslmode=require in SUPABASE_DB_URL.
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: ${SUPABASE_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${SUPABASE_DB_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    # Shared Supabase DB: teammates merge branches in different order (e.g. V030
    # applied before V026/V027). Let Flyway apply the late-arriving migrations.
    out-of-order: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

# Enable SPRING_PROFILES_ACTIVE=supabase when the application must write to
# Supabase. That profile activates a fail-fast guard which rejects localhost
# datasource URLs and remote PostgreSQL URLs without sslmode=require.

app:
  arrival-qr:
    clinic-id: ${APP_ARRIVAL_QR_CLINIC_ID:single-clinic}
    hmac-secret: ${APP_ARRIVAL_QR_HMAC_SECRET:}
    ttl-seconds: ${APP_ARRIVAL_QR_TTL_SECONDS:60}
    refresh-seconds: ${APP_ARRIVAL_QR_REFRESH_SECONDS:30}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    host: ${APP_EMAIL_HOST:smtp.gmail.com}
    port: ${APP_EMAIL_PORT:587}
    username: ${APP_EMAIL_USERNAME:}
    password: ${APP_EMAIL_PASSWORD:}
    from: ${APP_EMAIL_FROM:}
    connect-timeout-ms: ${APP_EMAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_EMAIL_READ_TIMEOUT_MS:10000}
    write-timeout-ms: ${APP_EMAIL_WRITE_TIMEOUT_MS:10000}
    max-attempts: ${APP_EMAIL_MAX_ATTEMPTS:2}
  auth:
    password-reset-url: ${APP_AUTH_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    rate-limit-hmac-secret: ${APP_AUTH_RATE_LIMIT_HMAC_SECRET:}
    staff-network:
      allowed-cidrs: ${APP_AUTH_STAFF_ALLOWED_CIDRS:127.0.0.1/32,::1/128}
      trusted-proxy-cidrs: ${APP_AUTH_STAFF_TRUSTED_PROXY_CIDRS:}
    google:
      issuer: ${GOOGLE_OIDC_ISSUER:https://accounts.google.com}
      audience: ${GOOGLE_OIDC_CLIENT_ID:}
      client-secret: ${GOOGLE_OIDC_CLIENT_SECRET:}
      token-uri: ${GOOGLE_OIDC_TOKEN_URI:https://oauth2.googleapis.com/token}
      jwk-set-uri: ${GOOGLE_OIDC_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      connect-timeout-ms: ${GOOGLE_OIDC_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GOOGLE_OIDC_READ_TIMEOUT_MS:10000}
    session-security:
      jwt-secret: ${APP_AUTH_JWT_SECRET:}
      access-token-seconds: ${APP_AUTH_ACCESS_TOKEN_SECONDS:900}
      refresh-token-seconds: ${APP_AUTH_REFRESH_TOKEN_SECONDS:604800}
      cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Strict}
      cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
      patient-origins: ${APP_AUTH_PATIENT_ORIGINS:https://patient.otcms.local}
      staff-origins: ${APP_AUTH_STAFF_ORIGINS:https://staff.otcms.local}

appointment:
  booking:
    max-horizon-days: ${APPOINTMENT_BOOKING_MAX_HORIZON_DAYS:30}
    online-minimum-notice-minutes: ${APPOINTMENT_BOOKING_ONLINE_MINIMUM_NOTICE_MINUTES:120}
    patient-change-deadline-minutes: ${APPOINTMENT_BOOKING_PATIENT_CHANGE_DEADLINE_MINUTES:1440}
    check-in-early-minutes: ${APPOINTMENT_BOOKING_CHECK_IN_EARLY_MINUTES:30}
    check-in-late-grace-minutes: ${APPOINTMENT_BOOKING_CHECK_IN_LATE_GRACE_MINUTES:15}
    slot-interval-minutes: ${APPOINTMENT_BOOKING_SLOT_INTERVAL_MINUTES:15}
    clinic-time-zone: ${APPOINTMENT_BOOKING_CLINIC_TIME_ZONE:Asia/Ho_Chi_Minh}
    public-rate-limit:
      requests: ${APPOINTMENT_BOOKING_PUBLIC_RATE_LIMIT_REQUESTS:60}
      window-seconds: ${APPOINTMENT_BOOKING_PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
      trusted-proxy-cidrs: ${APPOINTMENT_BOOKING_PUBLIC_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    readiness:
      required: ${APPOINTMENT_BOOKING_READINESS_REQUIRED:true}
      evidence-file: ${APPOINTMENT_BOOKING_READINESS_EVIDENCE_FILE:}
      evidence-sha256: ${APPOINTMENT_BOOKING_READINESS_EVIDENCE_SHA256:}
      evidence-signature: ${APPOINTMENT_BOOKING_READINESS_EVIDENCE_SIGNATURE:}
      verification-public-key: ${APPOINTMENT_BOOKING_READINESS_PUBLIC_KEY:}
      release-id: ${APP_RELEASE_ID:}
      migration-version: ${APP_EXPECTED_MIGRATION_VERSION:}
      expected-owner: ${APPOINTMENT_BOOKING_READINESS_OWNER:Owner Long}
