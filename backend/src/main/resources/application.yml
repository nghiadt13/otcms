
# Supabase provides managed PostgreSQL. Credentials must come from the process
# environment and must not be committed to this repository.

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: OTCMS_BE

  datasource:
    # Include ?sslmode=require in SUPABASE_DB_URL.
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: ${SUPABASE_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${SUPABASE_DB_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

# Enable SPRING_PROFILES_ACTIVE=supabase when the application must write to
# Supabase. That profile activates a fail-fast guard which rejects localhost
# datasource URLs and remote PostgreSQL URLs without sslmode=require.

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    host: ${APP_EMAIL_HOST:smtp.gmail.com}
    port: ${APP_EMAIL_PORT:587}
    username: ${APP_EMAIL_USERNAME:}
    password: ${APP_EMAIL_PASSWORD:}
    from: ${APP_EMAIL_FROM:}
    connect-timeout-ms: ${APP_EMAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_EMAIL_READ_TIMEOUT_MS:10000}
    write-timeout-ms: ${APP_EMAIL_WRITE_TIMEOUT_MS:10000}
    max-attempts: ${APP_EMAIL_MAX_ATTEMPTS:2}
  auth:
    rate-limit-hmac-secret: ${APP_AUTH_RATE_LIMIT_HMAC_SECRET:}
    google:
      issuer: ${GOOGLE_OIDC_ISSUER:https://accounts.google.com}
      audience: ${GOOGLE_OIDC_CLIENT_ID:}
      client-secret: ${GOOGLE_OIDC_CLIENT_SECRET:}
      token-uri: ${GOOGLE_OIDC_TOKEN_URI:https://oauth2.googleapis.com/token}
      jwk-set-uri: ${GOOGLE_OIDC_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      connect-timeout-ms: ${GOOGLE_OIDC_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${GOOGLE_OIDC_READ_TIMEOUT_MS:10000}
    session-security:
      jwt-secret: ${APP_AUTH_JWT_SECRET:}
      access-token-seconds: ${APP_AUTH_ACCESS_TOKEN_SECONDS:900}
      refresh-token-seconds: ${APP_AUTH_REFRESH_TOKEN_SECONDS:604800}
      cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Strict}
      cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
      patient-origins: ${APP_AUTH_PATIENT_ORIGINS:https://patient.otcms.local}
      staff-origins: ${APP_AUTH_STAFF_ORIGINS:https://staff.otcms.local}
